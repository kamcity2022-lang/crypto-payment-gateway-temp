<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Dashboard — Crypto Gateway</title>
    <style>
        body { background-color: #0b0f17; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; width: 100%; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid #30363d; padding-bottom: 16px; }
        .btn { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #f85149; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-box { background: #0d1117; padding: 16px; border-radius: 6px; border: 1px solid #30363d; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; color: #58a6ff; margin: 8px 0; }
        .stat-label { color: #8b949e; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { color: #8b949e; font-weight: 600; }
        .status-paid { color: #3fb950; }
        .status-pending { color: #d29922; }
        .status-expired { color: #f85149; }
        .hidden { display: none !important; }
        .login-form { max-width: 400px; margin: 100px auto; }
        .input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; box-sizing: border-box; }
        .error { color: #f85149; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div id="loginView" class="container login-form">
    <h2 style="text-align: center;">Merchant Login</h2>
    <div id="loginError" class="error hidden"></div>
    <input type="email" id="email" class="input" placeholder="Email" required>
    <input type="password" id="password" class="input" placeholder="Password" required>
    <button class="btn" style="width: 100%;" onclick="login()">Sign In</button>
</div>

<div id="dashboardView" class="container hidden">
    <div class="header">
        <div>
            <h2 style="margin: 0;">Dashboard</h2>
            <span id="merchantName" style="color: #8b949e; font-size: 14px;">Loading...</span>
        </div>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Total Invoices</div>
            <div class="stat-value" id="totalInvoices">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Paid</div>
            <div class="stat-value" style="color: #3fb950;" id="paidInvoices">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Pending</div>
            <div class="stat-value" style="color: #d29922;" id="pendingInvoices">-</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Received</div>
            <div class="stat-value" id="totalReceived">-</div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0;">Recent Invoices</h3>
        <table>
            <thead>
            <tr>
                <th>Invoice ID</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Created At</th>
            </tr>
            </thead>
            <tbody id="recentInvoicesTable">
            <tr><td colspan="4" style="text-align: center; color: #8b949e;">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = '/api/v1';

    async function checkAuth() {
        try {
            const res = await fetch(`${API_BASE}/dashboard/profile`, { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                document.getElementById('merchantName').textContent = data.name;
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                loadOverview();
            } else {
                showLogin();
            }
        } catch {
            showLogin();
        }
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');

        try {
            const res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: 'include'
            });
            const data = await res.json();
            if (res.ok) {
                checkAuth();
            } else {
                errorDiv.textContent = data.error || 'Login failed';
                errorDiv.classList.remove('hidden');
            }
        } catch (e) {
            errorDiv.textContent = 'Network error';
            errorDiv.classList.remove('hidden');
        }
    }

    async function logout() {
        // Note: Implement a dedicated logout endpoint in AuthController if needed, 
        // for now we just clear client state and rely on cookie expiration or add a simple fetch.
        await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' }).catch(() => {});
        showLogin();
    }

    function showLogin() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('loginView').classList.remove('hidden');
    }

    async function loadOverview() {
        try {
            const res = await fetch(`${API_BASE}/dashboard/overview`, { credentials: 'include' });
            if (!res.ok) return showLogin();
            const data = await res.json();

            document.getElementById('totalInvoices').textContent = data.totalInvoices;
            document.getElementById('paidInvoices').textContent = data.paidInvoices;
            document.getElementById('pendingInvoices').textContent = data.pendingInvoices;
            document.getElementById('totalReceived').textContent = `${data.totalReceivedAmount.toFixed(2)} ${data.fiatCurrency}`;

            const tbody = document.getElementById('recentInvoicesTable');
            tbody.innerHTML = '';
            if (data.recentInvoices.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #8b949e;">No invoices found.</td></tr>';
            } else {
                data.recentInvoices.forEach(inv => {
                    const statusClass = inv.status === 'Paid' || inv.status === 'Overpaid' ? 'status-paid' :
                        inv.status === 'Pending' || inv.status === 'PartiallyPaid' ? 'status-pending' : 'status-expired';
                    tbody.innerHTML += `
                            <tr>
                                <td style="font-family: monospace;">${inv.id.substring(0, 8)}...</td>
                                <td>${inv.fiatAmount.toFixed(2)} ${data.fiatCurrency}</td>
                                <td class="${statusClass}">${inv.status}</td>
                                <td>${new Date(inv.createdAtUtc).toLocaleDateString()}</td>
                            </tr>
        `;
                });
            }
        } catch (e) {
            console.error("Failed to load overview", e);
        }
    }

    // Initialize
    checkAuth();
</script>
</body>
</html>
